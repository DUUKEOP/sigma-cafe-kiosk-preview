services:
  - type: web
    name: jini-monto-api-preview
    runtime: python
    plan: free
    region: singapore
    rootDir: jini-monto-server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: JINI_MODE
        value: preview-only
      - key: JINI_DB_PATH
        value: /tmp/jini_monto_preview.db
      - key: JINI_CORS_ORIGINS
        value: https://duukeop.github.io
      - key: JINI_ADMIN_TOKEN
        generateValue: true
      - key: JINI_DEVICE_TOKEN
        generateValue: true
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
